name: Validate openstack-mcp commands

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      mcp_image:
        description: "LightSpeed MCP image to test"
        required: false
        default: "quay.io/openstack-lightspeed/rhos-mcps:latest"
      reference_image:
        description: "Reference OpenStack client image"
        required: false
        default: "quay.io/openstack-s2i-containers/openstack-openstackclient:master-latest"

jobs:
  validate-openstack-mcp-commands:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Compare OpenStack CLI commands
        run: |
          .github/scripts/validate-openstack-mcp-commands.sh "${{ github.event.inputs.mcp_image }}" "${{ github.event.inputs.reference_image }}"
