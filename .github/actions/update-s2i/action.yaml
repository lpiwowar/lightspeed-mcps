name: Update S2I
description: Update the S2I requirements.lock file; this action may be extended to update other S2I files later.

inputs:
  dependency_group:
    description: Optional uv dependency group to include in the S2I requirements file.
    required: false
    default: ""
  requirements_file:
    description: Requirements output path, relative to the repository root.
    required: false
    default: .s2i/requirements.lock
  sources_file:
    description: S2I source definition path, relative to the repository root.
    required: false
    default: .s2i/sources.txt
  stream:
    description: Stream to select from sources.txt.
    required: false
    default: master
  github_token:
    description: Token used to push the update branch and create the pull request.
    required: false
    default: ${{ github.token }}

outputs:
  changed:
    description: Whether the S2I requirements or sources changed.
    value: ${{ steps.changes.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: "3.12"

    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

    - name: Update source pins
      env:
        S2I_SOURCES_FILE: ${{ inputs.sources_file }}
        S2I_STREAM: ${{ inputs.stream }}
      shell: bash
      run: ${{ github.action_path }}/update-s2i.sh sources

    - name: Update hashed S2I requirements
      env:
        S2I_DEPENDENCY_GROUP: ${{ inputs.dependency_group }}
        S2I_REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        S2I_SOURCES_FILE: ${{ inputs.sources_file }}
        S2I_STREAM: ${{ inputs.stream }}
      shell: bash
      run: ${{ github.action_path }}/update-s2i.sh requirements

    - name: Check for changes
      id: changes
      env:
        REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        SOURCES_FILE: ${{ inputs.sources_file }}
      shell: bash
      run: |
        paths=("$REQUIREMENTS_FILE")
        if [ -f "$SOURCES_FILE" ]; then
          paths+=("$SOURCES_FILE")
        fi
        if git diff --quiet -- "${paths[@]}"; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create or update pull request
      if: steps.changes.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REQUIREMENTS_FILE: ${{ inputs.requirements_file }}
        SOURCES_FILE: ${{ inputs.sources_file }}
      shell: bash
      run: |
        set -euo pipefail

        branch="automation/update-s2i-requirements"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git add -- "$REQUIREMENTS_FILE"
        [ ! -f "$SOURCES_FILE" ] || git add -- "$SOURCES_FILE"
        git commit -m "Update S2I requirements ($(date +%Y-%m-%d))"
        git push --force --set-upstream origin "$branch"

        existing=$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')
        if [ -z "$existing" ]; then
          body="Automated S2I requirements update."
          body="${body}"$'\n\n'"Changes may include:"
          body="${body}"$'\n'"- Regenerated \`$REQUIREMENTS_FILE\`"
          if [ -f "$SOURCES_FILE" ]; then
            body="${body}"$'\n'"- Updated the upper-constraints commit in \`$SOURCES_FILE\`"
          fi
          gh pr create --title "Update S2I requirements" --body "$body"
        fi
